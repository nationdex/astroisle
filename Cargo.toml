[package]
name = "astroisle"
version = "0.1.0"
edition = "2021"
authors = ["NationDex Team", "MindVote Team"]
description = "Micro-Islands Bundler & Asset Delivery Pipeline for Alpine / Zero-JS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nationdex/astroisle"
readme = "README.md"
keywords = ["micro-islands", "bundler", "alpinejs", "sri", "nstd"]
categories = ["command-line-utilities", "web-programming"]

[lib]
name = "astroisle"
path = "src/lib.rs"

[[bin]]
name = "astroisle"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
rayon = "1.10"
walkdir = "2.5"
regex = "1.10"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
brotli = { version = "7", default-features = false, features = ["std"] }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
